# Prometheus for tools/test_http_docker.sh: scrapes the OpenTelemetry
# Collector's prometheus exporter (tools/otelcol.yaml, :8889), where the
# metrics that sample 02 pushes over OTLP (TOtlpMetricsExporter) appear.
# honor_labels keeps the "job" the collector derives from service.name
# (cities-api) instead of renaming it exported_job.
global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ["collector:8889"]
